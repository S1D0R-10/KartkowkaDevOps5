#bledy:
# 1. Dockerfile: CMD ["./app"] plik sie "server" budowany przez go build -o server
#CMD odwolywal do "./app" co robilo blad: exec ./app: no such file or directory
# 2. docker-compose.yml: ports "8080:8081" aplikacja musi sluchsc na porcie 8080 w kontenerze
#ale byl port 8081 co powodowalo blad z endpointem /health

name: Build and Deploy

on:
  push:
  workflow_dispatch:

jobs:
  build_image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker image build
        run: docker build -t go-docker:latest .

      - name: Print build sumary
        run: |
          echo "## Build Sumary" >> $GITHUB_STEP_SUMMARY
          echo "- **Event** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Comit** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  simulate_deploy:
    runs-on: ubuntu-latest
    needs: build_image
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Uruchamiam applikacjie
        run: docker compose up -d --build

      - name: czekamy
        run: sleep 5

      - name: check
        run: curl -f http://localhost:8080/health

      - name: save logi docker
        run: docker compose logs > compose-logs.txt

      - name: save docker compose ps
        run: docker compose ps > compose-ps.txt

      - name: export image jako tar
        run: |
          docker save go-docker:latest | gzip > go-docker-image.tar.gz
          
      - name: sumary
        run: |
          echo "## Deploy Sumary" >> $GITHUB_STEP_SUMMARY
          echo "### Compose PS" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat compose-ps.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "### Health Checki" >> $GITHUB_STEP_SUMMARY
          echo "Endpoint /health jest ok" >> $GITHUB_STEP_SUMMARY
